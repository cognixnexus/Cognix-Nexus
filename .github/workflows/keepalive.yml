name: Render Backend Keep-Alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Cognix Core API and Worker
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINTS=(
            "https://cognix-core-ypak.onrender.com/health"
            "https://cognix-core-worker-runtime.onrender.com/health"
          )
          for url in "${ENDPOINTS[@]}"; do
            echo "Pinging $url..."
            success=false
            for attempt in {1..3}; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || true)
              echo "Attempt $attempt: HTTP $code"
              if [[ "$code" == "200" ]]; then
                success=true
                break
              fi
              sleep 5
            done
            if [[ "$success" != "true" ]]; then
              echo "Warning: $url did not return 200 on attempt $attempt (HTTP $code)"
            fi
          done
          echo "Keep-alive ping completed."
